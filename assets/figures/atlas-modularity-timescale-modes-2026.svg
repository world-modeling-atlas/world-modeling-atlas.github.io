<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Brain network modularity changes in distinct ways across timescales</title>
<desc id="desc">Original synthesis diagram based on a 2026 review. The authors distinguish rapid transient integration during cognition, intermediate selective decoupling and stabilization during learning, and slow long-term rebalancing across development, ageing, and disease. These modes can produce similar global modularity scores despite different network changes.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fafc"/><stop offset="1" stop-color="#edf3f6"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#28404c" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="690" rx="28" fill="url(#bg)"/><text x="54" y="62" fill="#173846" font-family="Arial,sans-serif" font-size="30" font-weight="700">Modularity is a repertoire of network changes, not one number</text><text x="56" y="96" fill="#56717c" font-family="Arial,sans-serif" font-size="17">Timescale-dependent modes summarized in Finc, Adamska-Stolarczyk &amp; Bassett, Neuroscience &amp; Biobehavioral Reviews (2026)</text>
<rect x="48" y="130" width="1104" height="500" rx="22" fill="#fff" filter="url(#shadow)"/>
