<circle cx="510" cy="344" r="18" fill="#77a383"/><circle cx="550" cy="344" r="18" fill="#77a383"/><circle cx="610" cy="344" r="18" fill="#77a383"/><circle cx="650" cy="344" r="18" fill="#77a383"/><circle cx="690" cy="344" r="18" fill="#77a383"/><path d="M566 344 L594 344" stroke="#5c886c" stroke-width="4"/><path d="M666 344 L674 344" stroke="#5c886c" stroke-width="4"/>
