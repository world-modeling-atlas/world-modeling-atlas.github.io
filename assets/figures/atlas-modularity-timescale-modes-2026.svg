<text x="245" y="414" text-anchor="middle" fill="#315261" font-family="Arial,sans-serif" font-size="17" font-weight="700">Transient integration</text><text x="245" y="442" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="14">modules temporarily share</text><text x="245" y="463" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="14">information for a task</text>
<text x="600" y="414" text-anchor="middle" fill="#315261" font-family="Arial,sans-serif" font-size="17" font-weight="700">Selective decoupling</text><text x="600" y="442" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="14">training stabilizes useful</text><text x="600" y="463" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="14">connections and boundaries</text>
<text x="955" y="414" text-anchor="middle" fill="#315261" font-family="Arial,sans-serif" font-size="17" font-weight="700">Slow rebalancing</text><text x="955" y="442" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="14">development, ageing and illness</text><text x="955" y="463" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="14">reshape network organization</text>
<rect x="154" y="560" width="892" height="43" rx="12" fill="#f5f8fa" stroke="#d8e2e6" stroke-width="2"/><text x="600" y="588" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="14">Similar global modularity scores can hide different shifts in cohesion, coupling, or community membership.</text>
