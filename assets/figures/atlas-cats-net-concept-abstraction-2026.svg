<rect x="365" y="211" width="323" height="156" rx="18" fill="#eaf3ed" stroke="#d2e4d8" stroke-width="2"/><text x="526" y="253" text-anchor="middle" fill="#47725b" font-family="Arial,sans-serif" font-size="18" font-weight="700">Concept-abstraction module</text><text x="526" y="283" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="15">compresses features into a</text><text x="526" y="306" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="15">low-dimensional concept space</text><circle cx="467" cy="337" r="7" fill="#709c7a"/><circle cx="497" cy="337" r="7" fill="#709c7a"/><circle cx="527" cy="337" r="7" fill="#709c7a"/><circle cx="557" cy="337" r="7" fill="#709c7a"/><circle cx="587" cy="337" r="7" fill="#709c7a"/>
<rect x="798" y="211" width="302" height="156" rx="18" fill="#f4eff7" stroke="#dfd3e8" stroke-width="2"/><text x="949" y="253" text-anchor="middle" fill="#715b86" font-family="Arial,sans-serif" font-size="18" font-weight="700">Task-solving module</text><text x="949" y="283" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="15">uses concepts to guide</text><text x="949" y="306" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="15">visual judgments</text><rect x="904" y="325" width="90" height="25" rx="12" fill="#a58db6"/><text x="949" y="343" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="700">decision</text>
