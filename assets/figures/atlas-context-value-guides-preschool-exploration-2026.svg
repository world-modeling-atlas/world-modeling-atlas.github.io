<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Preschoolers explore ambiguity when the information helps with a later goal</title>
<desc id="desc">Original summary of a 2026 study of 72 children aged 3 to 6. Children chose between a safe immediate reward and an exploratory action that could reveal whether toy rules depended on color or shape. They chose the informative action more often when the information was needed to earn a larger later reward on a novel toy, 14 of 36 children, than when it was redundant for a familiar toy, 1 of 36.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fafc"/><stop offset="1" stop-color="#edf3f6"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#28404c" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="690" rx="28" fill="url(#bg)"/><text x="54" y="62" fill="#173846" font-family="Arial,sans-serif" font-size="29" font-weight="700">Children explore uncertainty when the information has a use</text><text x="56" y="96" fill="#56717c" font-family="Arial,sans-serif" font-size="17">72 children, ages 3–6 · Lapidow, Walker &amp; Ruggeri, Topics in Cognitive Science (2026)</text>
<rect x="48" y="130" width="1104" height="500" rx="22" fill="#fff" filter="url(#shadow)"/>
<rect x="86" y="174" width="1028" height="102" rx="16" fill="#f5f8fa"/><text x="600" y="208" text-anchor="middle" fill="#315261" font-family="Arial,sans-serif" font-size="16" font-weight="700">SAME AMBIGUITY · SAME COST OF EXPLORING</text><text x="600" y="239" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="16">Does a toy respond to a matching shape or a matching color?</text>
<rect x="91" y="305" width="491" height="251" rx="18" fill="#edf4f7"/><rect x="618" y="305" width="491" height="251" rx="18" fill="#f7f1e9"/><text x="336" y="345" text-anchor="middle" fill="#365d78" font-family="Arial,sans-serif" font-size="18" font-weight="700">NOVEL-TOY GOAL</text><text x="863" y="345" text-anchor="middle" fill="#93613b" font-family="Arial,sans-serif" font-size="18" font-weight="700">FAMILIAR-TOY GOAL</text>
<text x="336" y="377" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="14">Learning the rule can guide a new toy</text><text x="863" y="377" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="14">The rule is already known for the next toy</text>
<rect x="133" y="402" width="405" height="50" rx="12" fill="#fff" stroke="#d2dfe4" stroke-width="2"/><text x="336" y="433" text-anchor="middle" fill="#294c5a" font-family="Arial,sans-serif" font-size="15">Risk small sure reward to test a rule</text><rect x="660" y="402" width="405" height="50" rx="12" fill="#fff" stroke="#e4d6c3" stroke-width="2"/><text x="863" y="433" text-anchor="middle" fill="#6f573b" font-family="Arial,sans-serif" font-size="15">Take the sure reward; extra knowledge is redundant</text>
<text x="336" y="482" text-anchor="middle" fill="#315261" font-family="Arial,sans-serif" font-size="15" font-weight="700">Chose informative test</text><rect x="198" y="496" width="276" height="19" rx="9" fill="#d5e1e6"/><rect x="198" y="496" width="107" height="19" rx="9" fill="#6f9fb4"/><text x="336" y="540" text-anchor="middle" fill="#527b95" font-family="Arial,sans-serif" font-size="15" font-weight="700">14 / 36 children · 38.9%</text>
<text x="863" y="482" text-anchor="middle" fill="#315261" font-family="Arial,sans-serif" font-size="15" font-weight="700">Chose informative test</text><rect x="725" y="496" width="276" height="19" rx="9" fill="#e4d8c7"/><rect x="725" y="496" width="8" height="19" rx="4" fill="#c2935f"/><text x="863" y="540" text-anchor="middle" fill="#93613b" font-family="Arial,sans-serif" font-size="15" font-weight="700">1 / 36 children · 2.8%</text>
<text x="600" y="600" text-anchor="middle" fill="#718994" font-family="Arial,sans-serif" font-size="13">Original summary of the experiment; children faced the same ambiguity in both conditions.</text>
</svg>
