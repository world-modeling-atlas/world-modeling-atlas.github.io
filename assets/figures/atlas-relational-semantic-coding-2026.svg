<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Semantic relations and isolated concepts have partly distinct brain representations</title>
<desc id="desc">Original schematic of a 2026 fMRI study using large language model embeddings and behavioral data. Object and scene concepts were represented mainly in occipital and inferior temporal cortex, while parietal, dorsolateral prefrontal, and basal-ganglia regions carried relational information linking concepts. Relational coding strength in parietal, prefrontal, and striatal areas tracked participants' reasoning about scenes and objects.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fafc"/><stop offset="1" stop-color="#edf3f6"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#28404c" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67838f"/></marker></defs>
<rect width="1200" height="690" rx="28" fill="url(#bg)"/><text x="54" y="62" fill="#173846" font-family="Arial,sans-serif" font-size="29" font-weight="700">The brain represents concepts and their relations in part separately</text><text x="56" y="96" fill="#56717c" font-family="Arial,sans-serif" font-size="17">LLM-derived semantic features + behavioral judgments (n=636) + fMRI (n=60) · Bogdan et al., Current Biology (2026)</text>
<rect x="48" y="130" width="1104" height="500" rx="22" fill="#fff" filter="url(#shadow)"/>
<rect x="90" y="178" width="460" height="353" rx="18" fill="#edf4f7"/><rect x="650" y="178" width="460" height="353" rx="18" fill="#f2eff7"/><text x="320" y="218" text-anchor="middle" fill="#365d78" font-family="Arial,sans-serif" font-size="18" font-weight="700">CONCEPT FEATURES</text><text x="880" y="218" text-anchor="middle" fill="#715b86" font-family="Arial,sans-serif" font-size="18" font-weight="700">RELATIONAL STRUCTURE</text>
<circle cx="230" cy="303" r="44" fill="#89aec0"/><circle cx="410" cy="303" r="44" fill="#89aec0"/><text x="230" y="309" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">scene</text><text x="410" y="309" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">object</text><text x="320" y="386" text-anchor="middle" fill="#527b95" font-family="Arial,sans-serif" font-size="15" font-weight="700">Occipital + inferior temporal</text><text x="320" y="410" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="14">primarily code concepts in isolation</text>
<circle cx="790" cy="303" r="44" fill="#a38ab4"/><circle cx="970" cy="303" r="44" fill="#a38ab4"/><text x="790" y="309" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">scene</text><text x="970" y="309" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">object</text><path d="M840 303 L920 303" stroke="#715b86" stroke-width="5" marker-end="url(#arrow)"/><text x="880" y="281" text-anchor="middle" fill="#715b86" font-family="Arial,sans-serif" font-size="15" font-weight="700">relationship</text><text x="880" y="386" text-anchor="middle" fill="#715b86" font-family="Arial,sans-serif" font-size="15" font-weight="700">Parietal · dlPFC · basal ganglia</text><text x="880" y="410" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="14">strong relational coding, linked to reasoning</text>
<rect x="151" y="452" width="898" height="50" rx="14" fill="#f5f8fa" stroke="#d8e2e6" stroke-width="2"/><text x="600" y="483" text-anchor="middle" fill="#294c5a" font-family="Arial,sans-serif" font-size="15">Relational information can be represented even where concept information is comparatively weak.</text>
<text x="600" y="577" text-anchor="middle" fill="#718994" font-family="Arial,sans-serif" font-size="13">Original summary of an fMRI representational-similarity study; regions are schematic, not a map of exact activation boundaries.</text>
</svg>
