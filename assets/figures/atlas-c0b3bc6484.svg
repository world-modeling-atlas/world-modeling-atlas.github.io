ont-size="15" fill="#5b6b7d" font-weight="600">03</text><text x="745" y="205" font-family="Arial,sans-serif" font-size="21" fill="#162a40" font-weight="600">Test</text><text x="745" y="250" dy="0" font-family="Arial,sans-serif" font-size="18" fill="#33475c">Try it and update the</text><text x="745" y="250" dy="27" font-family="Arial,sans-serif" font-size="18" fill="#33475c">object model.</text><rect x="45" y="372" width="1010" height="54" rx="10" fill="#162a40"/><text x="65" y="405" font-family="Arial,sans-serif" font-size="18" fill="#fff" font-weight="600">Affordances link object properties to possible action.</text></svg>