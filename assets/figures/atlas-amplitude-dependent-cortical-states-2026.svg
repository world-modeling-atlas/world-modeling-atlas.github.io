<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Cortical co-fluctuations shift along a hierarchy as their amplitude changes</title>
<desc id="desc">Original explanatory schematic of a 2026 human resting-state fMRI study replicated across four datasets. High-amplitude co-fluctuations were dominated by sensorimotor systems, intermediate amplitudes by association systems, and low amplitudes by limbic systems. The hierarchy refined with development and reconfigured under external stimuli.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fafc"/><stop offset="1" stop-color="#edf3f6"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#28404c" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67838f"/></marker></defs>
<rect width="1200" height="690" rx="28" fill="url(#bg)"/><text x="54" y="62" fill="#173846" font-family="Arial,sans-serif" font-size="29" font-weight="700">Whole-cortex coordination shifts with fluctuation amplitude</text><text x="56" y="96" fill="#56717c" font-family="Arial,sans-serif" font-size="17">Resting-state fMRI · replicated in four independent samples · Jin et al., Nature Communications (2026)</text>
<rect x="48" y="130" width="1104" height="500" rx="22" fill="#fff" filter="url(#shadow)"/>
<text x="600" y="179" text-anchor="middle" fill="#315261" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1">MOMENTARY GLOBAL CO-FLUCTUATION AMPLITUDE</text>
<rect x="105" y="220" width="990" height="267" rx="18" fill="#f5f8fa" stroke="#d8e2e6" stroke-width="2"/>
<rect x="134" y="251" width="285" height="204" rx="15" fill="#e8f0f6"/><rect x="457" y="251" width="285" height="204" rx="15" fill="#e8f3ed"/><rect x="780" y="251" width="285" height="204" rx="15" fill="#f8efe6"/>
<text x="276" y="289" text-anchor="middle" fill="#365d78" font-family="Arial,sans-serif" font-size="21" font-weight="700">HIGH</text><text x="276" y="319" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="15">Sensorimotor systems</text><text x="276" y="345" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="15">dominate co-fluctuation</text>
<text x="599" y="289" text-anchor="middle" fill="#47725b" font-family="Arial,sans-serif" font-size="21" font-weight="700">INTERMEDIATE</text><text x="599" y="319" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="15">Association systems</text><text x="599" y="345" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="15">become prominent</text>
<text x="922" y="289" text-anchor="middle" fill="#93613b" font-family="Arial,sans-serif" font-size="21" font-weight="700">LOW</text><text x="922" y="319" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="15">Limbic systems</text><text x="922" y="345" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="15">are preferentially engaged</text>
<path d="M388 387 C430 365 441 365 479 387" fill="none" stroke="#67838f" stroke-width="3" marker-end="url(#arrow)"/><path d="M711 387 C753 365 764 365 802 387" fill="none" stroke="#67838f" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M139 535 L1061 535" stroke="#78929c" stroke-width="3"/><path d="M139 535 L139 525 M1061 535 L1061 525" stroke="#78929c" stroke-width="3"/><text x="139" y="563" fill="#56717c" font-family="Arial,sans-serif" font-size="15">Stronger</text><text x="1061" y="563" text-anchor="end" fill="#56717c" font-family="Arial,sans-serif" font-size="15">Weaker</text><text x="600" y="563" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="15">global co-fluctuation amplitude</text>
<text x="600" y="603" text-anchor="middle" fill="#718994" font-family="Arial,sans-serif" font-size="13">The ordering is dynamic, refines across development, and changes with external stimulation. Original summary, not a reproduction of the paper’s figures.</text>
</svg>
