<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">A proposed electrophysiological account of the multiple-demand network</title>
  <desc id="desc">An original schematic of a 2025 framework: aperiodic broadband activity may index local task demand in multiple-demand regions, while delta and theta synchrony may coordinate activity between frontal and parietal regions. The framework is a proposal, not a settled mechanism.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fafc"/><stop offset="1" stop-color="#edf3f6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#28404c" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63818e"/></marker>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="54" y="65" fill="#173846" font-family="Arial,sans-serif" font-size="30" font-weight="700">How might the multiple-demand network coordinate control?</text>
  <text x="56" y="99" fill="#56717c" font-family="Arial,sans-serif" font-size="17">A 2025 framework links two electrophysiological signals to complementary jobs.</text>
  <rect x="48" y="132" width="1104" height="490" rx="22" fill="#fff" filter="url(#shadow)"/>
  <rect x="92" y="177" width="365" height="366" rx="20" fill="#eef4f7"/>
  <text x="274" y="216" text-anchor="middle" fill="#315261" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1">MULTIPLE-DEMAND NETWORK</text>
  <ellipse cx="272" cy="358" rx="137" ry="88" fill="#fff" stroke="#c7d6dc" stroke-width="2"/>
  <path d="M178 358 C214 313 241 400 279 356 S344 312 374 357" fill="none" stroke="#b6c8cf" stroke-width="5"/>
  <line x1="213" y1="333" x2="329" y2="384" stroke="#4a8191" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="213" y1="387" x2="329" y2="333" stroke="#9b78b7" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="206" cy="358" r="47" fill="#dcecf0" stroke="#4a8191" stroke-width="3"/>
  <circle cx="339" cy="358" r="47" fill="#efe6f5" stroke="#9b78b7" stroke-width="3"/>
  <text x="206" y="354" text-anchor="middle" fill="#2c5968" font-family="Arial,sans-serif" font-size="15" font-weight="700">Lateral</text>
  <text x="206" y="375" text-anchor="middle" fill="#2c5968" font-family="Arial,sans-serif" font-size="15">PFC</text>
  <text x="339" y="354" text-anchor="middle" fill="#674c7e" font-family="Arial,sans-serif" font-size="15" font-weight="700">Parietal</text>
  <text x="339" y="375" text-anchor="middle" fill="#674c7e" font-family="Arial,sans-serif" font-size="15">cortex</text>
  <text x="274" y="478" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="15">Demand rises across changing tasks</text>
  <line x1="458" y1="286" x2="521" y2="286" stroke="#63818e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="458" y1="445" x2="521" y2="445" stroke="#63818e" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="535" y="176" width="552" height="174" rx="18" fill="#eaf4f2" stroke="#bddbd5" stroke-width="2"/>
  <text x="566" y="217" fill="#236e68" font-family="Arial,sans-serif" font-size="20" font-weight="700">Aperiodic broadband activity</text>
  <text x="566" y="246" fill="#3c6268" font-family="Arial,sans-serif" font-size="16">Candidate index of local task demand inside MD regions</text>
  <path d="M572 308 C597 308 604 299 618 299 C635 299 639 279 652 279 C666 279 673 312 687 312 C701 312 707 269 724 269 C742 269 748 305 763 305 C779 305 786 258 803 258 C819 258 827 296 843 296 C859 296 864 278 882 278 C900 278 904 285 919 285 C939 285 946 274 966 274 C983 274 990 278 1014 278" fill="none" stroke="#23847b" stroke-width="4" stroke-linecap="round"/>
  <text x="566" y="331" fill="#67817f" font-family="Arial,sans-serif" font-size="13">Broadband background · potentially related to population spiking / E–I balance</text>
  <rect x="535" y="365" width="552" height="174" rx="18" fill="#f3eef8" stroke="#d8c9e5" stroke-width="2"/>
  <text x="566" y="406" fill="#755295" font-family="Arial,sans-serif" font-size="20" font-weight="700">Delta and theta synchrony</text>
  <text x="566" y="435" fill="#625476" font-family="Arial,sans-serif" font-size="16">Candidate mechanism for coordination between MD regions</text>
  <path d="M572 477 C593 441 614 441 635 477 S677 513 698 477 S740 441 761 477 S803 513 824 477 S866 441 887 477 S929 513 950 477 S992 441 1014 477" fill="none" stroke="#9a78b5" stroke-width="4" stroke-linecap="round"/>
  <text x="566" y="521" fill="#7e7190" font-family="Arial,sans-serif" font-size="13">Low-frequency rhythms may help synchronize distributed control areas</text>
  <rect x="91" y="563" width="996" height="37" rx="18" fill="#f5f0e6"/>
  <text x="589" y="588" text-anchor="middle" fill="#80632f" font-family="Arial,sans-serif" font-size="15" font-weight="700">PROPOSED FRAMEWORK · SIGNALS ARE CANDIDATES, NOT SETTLED CAUSAL MECHANISMS</text>
  <text x="92" y="651" fill="#8298a1" font-family="Arial,sans-serif" font-size="13">Original schematic based on Lu (2025).</text>
</svg>
