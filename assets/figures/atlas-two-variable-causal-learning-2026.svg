<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Children learn to separate two causal variables</title>
<desc id="desc">Original schematic of a 2026 study with Japanese children. In a task where one cause changed an object's shape and another changed its size, most children aged five to six separated the contributions and selected an intervention to produce a desired result; four-year-olds had more difficulty representing both causes.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fafc"/><stop offset="1" stop-color="#edf3f6"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#28404c" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67838f"/></marker></defs>
<rect width="1200" height="690" rx="28" fill="url(#bg)"/><text x="54" y="62" fill="#173846" font-family="Arial,sans-serif" font-size="29" font-weight="700">A step toward causal models: tracking two causes at once</text><text x="56" y="96" fill="#56717c" font-family="Arial,sans-serif" font-size="17">Japanese children · two studies · Hayashi &amp; Nakamichi, Cognitive Development (2026)</text>
<rect x="48" y="130" width="1104" height="500" rx="22" fill="#fff" filter="url(#shadow)"/>
