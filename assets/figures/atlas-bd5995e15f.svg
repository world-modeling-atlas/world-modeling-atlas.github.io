<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="465" viewBox="0 0 1100 465" role="img" aria-label="Ideas become useful through synthesis"><rect width="1100" height="465" rx="18" fill="#f7f8fa"/><text x="45" y="48" font-family="Arial,sans-serif" font-size="15" fill="#5b6b7d" font-weight="600">WORLD MODELING ATLAS · CONCEPTUAL GUIDE</text><text x="45" y="94" font-family="Arial,sans-serif" font-size="30" fill="#162a40" font-weight="600">Ideas become useful through synthesis</text><rect x="45" y="135" width="318" height="210" rx="13" fill="#dff0eb" stroke="#bcc8d4"/><text x="63" y="166" font-family="Arial,sans-serif" font-size="15" fill="#5b6b7d" font-weight="600">01</text><text x="63" y="205" font-family="Arial,sans-serif" font-size="21" fill="#162a40" font-weight="600">Connect</text><text x="63" y="250" dy="0" font-family="Arial,sans-serif" font-size="18" fill="#33475c">Relate findings from</text><text x="63" y="250" dy="27" font-family="Arial,sans-serif" font-size="18" fill="#33475c">separate literatures.</text><path d="M 368 244 h 12" stroke="#567483" stroke-width="3"/><path d="M 375 239 l 7 5 l -7 5" fill="none" stroke="#567483" stroke-width="3"/><rect x="386" y="135" width="318" height="210" rx="13" fill="#e8edf7" stroke="#bcc8d4"/><text x="404" y="166" font-family="Arial,sans-serif" font-size="15" fill="#5b6b7d" font-weight="600">02</text><text x="404" y="205" font-family="Arial,sans-serif" font-size="21" fill="#162a40" font-weight="600">Constrain</text><text x="404" y="250" dy="0" font-family="Arial,sans-serif" font-size="18" fill="#33475c">Use evidence to narrow</text><text x="404" y="250" dy="27" font-family="Arial,sans-serif" font-size="18" fill="#33475c">possible mechanisms.</text><path d="M 709 244 h 12" stroke="#567483" stroke-width="3"/><path d="M 716 239 l 7 5 l -7 5" fill="none" stroke="#567483" stroke-width="3"/><rect x="727" y="135" width="318" height="210" rx="13" fill="#fbedd2" stroke="#bcc8d4"/><text x="745" y="166" font-family="Arial,sans-serif" font-size="15" fill="#5b6b7d" font-weight="600">03</text><text x="745" y="205" font-family="Arial,sans-serif" font-size="21" fill="#162a40" font-weight="600">Predict</text><text x="745" y="250" dy="0" font-family="Arial,sans-serif" font-size="18" fill="#33475c">Derive a new testable</text><text x="745" y="250" dy="27" font-family="Arial,sans-serif" font-size="18" fill="#33475c">consequence.</text><rect x="45" y="372" width="1010" height="54" rx="10" fill="#162a40"/><text x="65" y="405" font-family="Arial,sans-serif" font-size="18" fill="#fff" font-weight="600">Synthesis is strongest when it creates new predictions.</text></svg>