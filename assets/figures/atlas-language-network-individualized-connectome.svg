<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">An individualized language network recovered from unrelated brain scans</title>
  <desc id="desc">A 2026 study applied individualized functional connectomics to 1,957 fMRI sessions from 1,199 people performing diverse tasks. It recovered a largely left-dominant frontotemporal network that was more stable within a person than across people and selective for language.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fafc"/><stop offset="1" stop-color="#edf3f6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#28404c" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64818e"/></marker>
  </defs>
  <rect width="1200" height="690" rx="28" fill="url(#bg)"/>
  <text x="54" y="65" fill="#173846" font-family="Arial,sans-serif" font-size="30" font-weight="700">Language-selective networks can emerge from individual connectivity</text>
  <text x="56" y="99" fill="#56717c" font-family="Arial,sans-serif" font-size="17">A 2026 study recovered them from brain scans collected during many different tasks.</text>
  <rect x="48" y="132" width="1104" height="510" rx="22" fill="#fff" filter="url(#shadow)"/>
  <rect x="82" y="174" width="294" height="385" rx="18" fill="#f2f6f7"/>
  <text x="108" y="213" fill="#315261" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1">DATA AT SCALE</text>
  <circle cx="228" cy="305" r="66" fill="#fff" stroke="#bed0d6" stroke-width="3"/>
  <text x="228" y="301" text-anchor="middle" fill="#244753" font-family="Arial,sans-serif" font-size="29" font-weight="700">1,199</text>
  <text x="228" y="328" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="15">individual brains</text>
  <text x="108" y="405" fill="#315261" font-family="Arial,sans-serif" font-size="18" font-weight="700">1,957 fMRI sessions</text>
  <text x="108" y="435" fill="#59737d" font-family="Arial,sans-serif" font-size="15">Collected during diverse tasks,</text>
  <text x="108" y="458" fill="#59737d" font-family="Arial,sans-serif" font-size="15">including non-language tasks.</text>
  <rect x="108" y="490" width="237" height="43" rx="12" fill="#e8f1f3"/>
  <text x="226" y="518" text-anchor="middle" fill="#3c626b" font-family="Arial,sans-serif" font-size="15" font-weight="700">Individual connectomes</text>
  <line x1="380" y1="366" x2="431" y2="366" stroke="#64818e" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="449" y="174" width="652" height="385" rx="18" fill="#fbfafc" stroke="#e2dbe8" stroke-width="2"/>
  <text x="480" y="213" fill="#513d68" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1">RECOVERED LANGUAGE NETWORK</text>
  <!-- schematic lateral brain profile -->
  <path d="M550 387 C520 360 526 305 563 282 C579 241 633 227 665 246 C704 215 753 231 772 254 C817 251 847 283 845 316 C882 340 874 392 846 412 C831 455 783 467 751 448 C715 474 673 461 659 444 C620 459 579 437 575 410 C563 406 555 398 550 387Z" fill="#f4f0f8" stroke="#c9b9d7" stroke-width="3"/>
  <path d="M565 280 C580 309 579 336 568 364 M620 249 C631 276 627 298 614 319 M687 243 C692 269 683 291 667 306 M764 258 C749 278 748 301 761 321 M837 316 C808 324 793 344 795 368 M845 405 C817 390 789 391 770 411 M658 444 C664 418 680 401 704 394" fill="none" stroke="#ded4e7" stroke-width="2"/>
  <path d="M604 333 C647 300 685 315 709 340 S763 377 813 345" fill="none" stroke="#80619a" stroke-width="5" stroke-linecap="round"/>
  <path d="M608 376 C652 413 692 398 722 372 S771 333 812 378" fill="none" stroke="#4d8a91" stroke-width="5" stroke-linecap="round"/>
  <circle cx="604" cy="333" r="13" fill="#80619a"/><circle cx="709" cy="340" r="13" fill="#80619a"/><circle cx="813" cy="345" r="13" fill="#80619a"/>
  <circle cx="608" cy="376" r="13" fill="#4d8a91"/><circle cx="722" cy="372" r="13" fill="#4d8a91"/><circle cx="812" cy="378" r="13" fill="#4d8a91"/>
  <text x="544" y="493" fill="#755b8a" font-family="Arial,sans-serif" font-size="15" font-weight="700">LEFT-DOMINANT FRONTOTEMPORAL</text>
  <rect x="872" y="249" width="199" height="147" rx="15" fill="#eaf4f2" stroke="#bddbd5" stroke-width="2"/>
  <text x="971" y="281" text-anchor="middle" fill="#236e68" font-family="Arial,sans-serif" font-size="15" font-weight="700">MORE STABLE</text>
  <text x="971" y="309" text-anchor="middle" fill="#3c6268" font-family="Arial,sans-serif" font-size="14">within the same person</text>
  <text x="971" y="331" text-anchor="middle" fill="#3c6268" font-family="Arial,sans-serif" font-size="14">than between different</text>
  <text x="971" y="353" text-anchor="middle" fill="#3c6268" font-family="Arial,sans-serif" font-size="14">people</text>
  <rect x="872" y="414" width="199" height="102" rx="15" fill="#eef2f8" stroke="#c9d5e5" stroke-width="2"/>
  <text x="971" y="448" text-anchor="middle" fill="#496283" font-family="Arial,sans-serif" font-size="15" font-weight="700">LANGUAGE-SELECTIVE</text>
  <text x="971" y="475" text-anchor="middle" fill="#5c6e83" font-family="Arial,sans-serif" font-size="14">recoverable from varied</text>
  <text x="971" y="496" text-anchor="middle" fill="#5c6e83" font-family="Arial,sans-serif" font-size="14">task scans</text>
  <text x="82" y="604" fill="#8298a1" font-family="Arial,sans-serif" font-size="13">Original schematic based on Shain &amp; Fedorenko (2026); the network drawing is conceptual, not an anatomical coordinate map.</text>
</svg>
