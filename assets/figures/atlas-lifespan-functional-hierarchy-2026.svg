<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">The cortical functional hierarchy changes nonlinearly across the lifespan</title>
<desc id="desc">Original qualitative schematic of a 2026 Nature study using functional MRI from birth to age 100. Cortical gradients are anchored in primary sensory systems in infancy, differentiate along association and control axes during childhood and adolescence, and gradually dedifferentiate during ageing. Gradient measures predicted cognitive performance across development.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fafc"/><stop offset="1" stop-color="#edf3f6"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#28404c" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="690" rx="28" fill="url(#bg)"/><text x="54" y="62" fill="#173846" font-family="Arial,sans-serif" font-size="29" font-weight="700">Cortical functional hierarchy follows a lifespan trajectory</text><text x="56" y="96" fill="#56717c" font-family="Arial,sans-serif" font-size="17">Normative fMRI reference from birth to 100 years · Taylor et al., Nature (2026)</text>
<rect x="48" y="130" width="1104" height="500" rx="22" fill="#fff" filter="url(#shadow)"/>
<text x="112" y="185" fill="#315261" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1">CORTICAL GRADIENT DIFFERENTIATION</text><path d="M155 498 L155 222 M155 498 L1058 498" fill="none" stroke="#8aa0a9" stroke-width="3"/><path d="M1058 498 L1047 491 L1047 505Z" fill="#8aa0a9"/><path d="M155 222 L148 233 L162 233Z" fill="#8aa0a9"/>
<path d="M170 464 C262 431 304 355 403 310 C490 271 560 252 660 254 C754 257 827 272 904 302 C970 329 1019 372 1043 425" fill="none" stroke="#4d8a7c" stroke-width="8" stroke-linecap="round"/>
<line x1="409" y1="235" x2="409" y2="498" stroke="#d9e3e6" stroke-width="2" stroke-dasharray="7 7"/><line x1="667" y1="235" x2="667" y2="498" stroke="#d9e3e6" stroke-width="2" stroke-dasharray="7 7"/><line x1="908" y1="235" x2="908" y2="498" stroke="#d9e3e6" stroke-width="2" stroke-dasharray="7 7"/>
<text x="170" y="535" fill="#56717c" font-family="Arial,sans-serif" font-size="15">Birth</text><text x="408" y="535" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="15">Childhood</text><text x="667" y="535" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="15">Adolescence</text><text x="908" y="535" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="15">Adulthood</text><text x="1043" y="535" text-anchor="end" fill="#56717c" font-family="Arial,sans-serif" font-size="15">Age 100</text>
<text x="278" y="398" text-anchor="middle" fill="#315261" font-family="Arial,sans-serif" font-size="16" font-weight="700">Sensory-anchored</text><text x="278" y="421" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="14">organization</text><text x="548" y="314" text-anchor="middle" fill="#315261" font-family="Arial,sans-serif" font-size="16" font-weight="700">Association and control</text><text x="548" y="336" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="14">axes differentiate</text><text x="826" y="259" text-anchor="middle" fill="#315261" font-family="Arial,sans-serif" font-size="16" font-weight="700">Stable hierarchy</text><text x="980" y="362" text-anchor="middle" fill="#315261" font-family="Arial,sans-serif" font-size="16" font-weight="700">Gradual</text><text x="980" y="384" text-anchor="middle" fill="#315261" font-family="Arial,sans-serif" font-size="16" font-weight="700">dedifferentiation</text>
<rect x="172" y="570" width="856" height="35" rx="11" fill="#f5f8fa" stroke="#d8e2e6" stroke-width="2"/><text x="600" y="593" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="14">Gradient measures also tracked cognitive performance, structure–function coupling, and age-varying transcriptomic associations.</text><text x="600" y="620" text-anchor="middle" fill="#718994" font-family="Arial,sans-serif" font-size="12">Qualitative schematic of group-level trends, not a participant-level trajectory or quantitative plot.</text>
