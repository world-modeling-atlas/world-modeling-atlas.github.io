<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Four functional regions of the human insula</title>
<desc id="desc">Original schematic summarizing a 2026 human intracranial stimulation and EEG study of 87 implanted participants. Four insular regions are associated with different bodily signals and salience functions, with an anterior-polar region exerting direct influence over other insular regions.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fafc"/><stop offset="1" stop-color="#edf3f6"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#28404c" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607b86"/></marker></defs>
<rect width="1200" height="690" rx="28" fill="url(#bg)"/>
<text x="54" y="62" fill="#173846" font-family="Arial,sans-serif" font-size="30" font-weight="700">The human insula contains four functionally distinct regions</text>
<text x="56" y="96" fill="#56717c" font-family="Arial,sans-serif" font-size="17">2026 intracranial stimulation, task EEG and connectivity mapping · 87 implanted participants</text>
<rect x="48" y="130" width="1104" height="500" rx="22" fill="#fff" filter="url(#shadow)"/>
<text x="86" y="176" fill="#315261" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1">POSTERIOR</text><text x="1007" y="176" fill="#315261" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1">ANTERIOR</text>
<path d="M160 314 C255 233 367 237 483 270 C588 299 681 291 760 266 C852 237 964 263 1037 327 C970 393 866 416 764 383 C654 348 567 356 473 388 C355 427 247 399 160 314Z" fill="#f1f6f7" stroke="#b9cbd2" stroke-width="3"/>
<path d="M167 310 C248 252 330 250 405 267 L403 355 C323 380 242 371 167 318Z" fill="#6da9ba"/><path d="M167 320 C245 376 325 382 403 357 L405 391 C320 416 240 399 167 322Z" fill="#9ac5cc"/>
<path d="M414 269 C507 287 572 303 650 300 L648 366 C569 355 502 354 413 358Z" fill="#e7a76f"/><path d="M657 298 C744 281 794 257 866 268 L867 383 C789 392 730 374 650 366Z" fill="#c485a4"/><path d="M873 269 C937 264 991 288 1032 326 C990 363 938 383 873 383Z" fill="#7899c1"/>
<text x="283" y="302" text-anchor="middle" fill="#123b49" font-family="Arial,sans-serif" font-size="18" font-weight="700">I · Dorsal posterior</text><text x="283" y="330" text-anchor="middle" fill="#123b49" font-family="Arial,sans-serif" font-size="15">Pain, temperature, touch</text>
<text x="283" y="373" text-anchor="middle" fill="#254955" font-family="Arial,sans-serif" font-size="15">Somatotopic signals</text>
<text x="532" y="326" text-anchor="middle" fill="#49301f" font-family="Arial,sans-serif" font-size="18" font-weight="700">II · Ventral posterior</text><text x="532" y="350" text-anchor="middle" fill="#49301f" font-family="Arial,sans-serif" font-size="14">Somatic input across</text><text x="532" y="371" text-anchor="middle" fill="#49301f" font-family="Arial,sans-serif" font-size="14">multiple body parts</text>
<text x="757" y="324" text-anchor="middle" fill="#4a2439" font-family="Arial,sans-serif" font-size="18" font-weight="700">III · Mid-anterior</text><text x="757" y="350" text-anchor="middle" fill="#4a2439" font-family="Arial,sans-serif" font-size="14">Visceral sensation</text><text x="757" y="371" text-anchor="middle" fill="#4a2439" font-family="Arial,sans-serif" font-size="14">and anxiety</text>
<text x="951" y="315" text-anchor="middle" fill="#263b5a" font-family="Arial,sans-serif" font-size="17" font-weight="700">IV · Anterior polar</text><text x="951" y="340" text-anchor="middle" fill="#263b5a" font-family="Arial,sans-serif" font-size="13">Salience and</text><text x="951" y="360" text-anchor="middle" fill="#263b5a" font-family="Arial,sans-serif" font-size="13">action-mode change</text>
<path d="M945 430 C842 493 658 497 510 442" fill="none" stroke="#607b86" stroke-width="4" marker-end="url(#arrow)"/><path d="M941 431 C844 464 762 457 717 421" fill="none" stroke="#607b86" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="170" y="489" width="864" height="77" rx="16" fill="#f5f8fa" stroke="#d8e2e6" stroke-width="2"/><text x="602" y="520" text-anchor="middle" fill="#294c5a" font-family="Arial,sans-serif" font-size="17" font-weight="700">Anterior-polar region IV directly influences other insular regions</text><text x="602" y="546" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="15">The pathway is asymmetric: region IV receives weaker, indirect inputs from them</text>
<text x="602" y="600" text-anchor="middle" fill="#718994" font-family="Arial,sans-serif" font-size="13">Original summary diagram; boundaries and sizes are schematic, not an anatomical atlas.</text>
</svg>
