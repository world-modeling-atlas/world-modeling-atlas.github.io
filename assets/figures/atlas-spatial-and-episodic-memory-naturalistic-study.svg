<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">A naturalistic tour links spatial navigation and episodic memory</title>
  <desc id="desc">A 2025 study guided children and young adults on a real-world tour, then tested spatial and episodic memory. Factor analysis found two highly correlated dimensions: spatiotemporal structure and perceptual, factual, and locale memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fafc"/><stop offset="1" stop-color="#edf3f6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#28404c" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#668491"/></marker>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <text x="54" y="65" fill="#173846" font-family="Arial,sans-serif" font-size="30" font-weight="700">Spatial navigation and episodic memory overlap in real experience</text>
  <text x="56" y="99" fill="#56717c" font-family="Arial,sans-serif" font-size="17">A 2025 study tested memory for a guided tour in children and young adults.</text>
  <rect x="48" y="132" width="1104" height="516" rx="22" fill="#fff" filter="url(#shadow)"/>
  <text x="82" y="174" fill="#315261" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1">ONE SHARED EXPERIENCE · 130 PARTICIPANTS</text>
  <rect x="82" y="196" width="1036" height="128" rx="18" fill="#f1f6f7"/>
  <!-- route/map vignette -->
  <path d="M132 283 C188 229 246 296 307 244 S420 250 464 220" fill="none" stroke="#68a7a1" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 15"/>
  <circle cx="132" cy="283" r="11" fill="#fff" stroke="#317a77" stroke-width="5"/><circle cx="307" cy="244" r="11" fill="#fff" stroke="#317a77" stroke-width="5"/><circle cx="464" cy="220" r="11" fill="#fff" stroke="#317a77" stroke-width="5"/>
  <rect x="169" y="220" width="30" height="29" rx="5" fill="#e8c889"/><path d="M166 220L184 207L202 220" fill="#c99d52"/>
  <rect x="353" y="256" width="30" height="29" rx="5" fill="#edb79d"/><path d="M350 256L368 243L386 256" fill="#ca8164"/>
  <text x="516" y="235" fill="#244753" font-family="Arial,sans-serif" font-size="20" font-weight="700">Guided real-world tour</text>
  <text x="516" y="265" fill="#59737d" font-family="Arial,sans-serif" font-size="16">Participants learned object locations and had experiences at each place.</text>
  <text x="516" y="294" fill="#59737d" font-family="Arial,sans-serif" font-size="15">46 children ages 8–10 · 42 ages 11–13 · 42 young adults</text>
  <line x1="600" y1="329" x2="600" y2="359" stroke="#668491" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="82" y="394" fill="#315261" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1">SEVEN MEMORY MEASURES RESOLVED INTO TWO RELATED DIMENSIONS</text>
  <rect x="82" y="418" width="484" height="182" rx="18" fill="#eaf4f2" stroke="#bddbd5" stroke-width="2"/>
  <text x="108" y="456" fill="#236e68" font-family="Arial,sans-serif" font-size="20" font-weight="700">Spatiotemporal structure</text>
  <text x="108" y="489" fill="#3c6268" font-family="Arial,sans-serif" font-size="16">Route finding · symbolic map-building</text>
  <text x="108" y="516" fill="#3c6268" font-family="Arial,sans-serif" font-size="16">Free recall · spatial-temporal recognition</text>
  <rect x="634" y="418" width="484" height="182" rx="18" fill="#f4eff8" stroke="#d8c9e5" stroke-width="2"/>
  <text x="660" y="456" fill="#755295" font-family="Arial,sans-serif" font-size="20" font-weight="700">Perceptual / factual / locale</text>
  <text x="660" y="489" fill="#625476" font-family="Arial,sans-serif" font-size="16">Remembering what was seen and learned</text>
  <text x="660" y="516" fill="#625476" font-family="Arial,sans-serif" font-size="16">and which places or contexts it belonged to</text>
  <line x1="568" y1="500" x2="628" y2="500" stroke="#8296a1" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="465" y="541" width="270" height="38" rx="19" fill="#fff" stroke="#c7d4d9"/>
  <text x="600" y="566" text-anchor="middle" fill="#536d77" font-family="Arial,sans-serif" font-size="15" font-weight="700">HIGHLY CORRELATED FACTORS</text>
  <text x="82" y="629" fill="#8298a1" font-family="Arial,sans-serif" font-size="13">Original schematic based on Nguyen, Olson &amp; Newcombe (2025); factors are related, not interchangeable.</text>
</svg>
