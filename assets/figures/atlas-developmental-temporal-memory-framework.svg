<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">A proposed developmental shift toward hierarchical temporal memory</title>
  <desc id="desc">A 2026 review proposes that temporal memory expands from local, event-specific representations in younger children, to knowledge of temporal regularities supported by hippocampal and lateral frontoparietal interaction in older children and adolescents, to flexible hierarchical knowledge in adults involving hippocampal and medial frontoparietal interaction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fafc"/><stop offset="1" stop-color="#edf3f6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#28404c" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67838f"/></marker>
  </defs>
  <rect width="1200" height="690" rx="28" fill="url(#bg)"/>
  <text x="54" y="65" fill="#173846" font-family="Arial,sans-serif" font-size="30" font-weight="700">Temporal memory gains broader and more flexible structure</text>
  <text x="56" y="99" fill="#56717c" font-family="Arial,sans-serif" font-size="17">A 2026 review proposes a developmental account of hippocampal–frontoparietal collaboration.</text>
  <rect x="48" y="132" width="1104" height="508" rx="22" fill="#fff" filter="url(#shadow)"/>
  <text x="82" y="177" fill="#315261" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1">PROPOSED DEVELOPMENTAL FRAMEWORK</text>
  <rect x="82" y="207" width="300" height="320" rx="18" fill="#eff5f7" stroke="#d2e0e5" stroke-width="2"/>
  <text x="232" y="249" text-anchor="middle" fill="#315261" font-family="Arial,sans-serif" font-size="19" font-weight="700">Younger children</text>
  <text x="232" y="278" text-anchor="middle" fill="#59737d" font-family="Arial,sans-serif" font-size="15">Local, event-specific memory</text>
  <rect x="121" y="318" width="222" height="61" rx="13" fill="#fff" stroke="#c8d8de" stroke-width="2"/>
  <circle cx="154" cy="348" r="12" fill="#77a6b3"/><circle cx="232" cy="348" r="12" fill="#77a6b3"/><circle cx="310" cy="348" r="12" fill="#77a6b3"/>
  <line x1="169" y1="348" x2="216" y2="348" stroke="#9eb8c0" stroke-width="3"/><line x1="247" y1="348" x2="294" y2="348" stroke="#9eb8c0" stroke-width="3"/>
  <text x="232" y="414" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="15">Remember details from one</text>
  <text x="232" y="437" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="15">event and its local sequence</text>
  <rect x="117" y="464" width="230" height="39" rx="18" fill="#e2eef1"/>
  <text x="232" y="490" text-anchor="middle" fill="#416570" font-family="Arial,sans-serif" font-size="14" font-weight="700">HIPPOCAMPAL BINDING</text>
  <line x1="389" y1="365" x2="421" y2="365" stroke="#67838f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="432" y="207" width="336" height="320" rx="18" fill="#f2eef7" stroke="#ddd3e8" stroke-width="2"/>
  <text x="600" y="249" text-anchor="middle" fill="#644d7e" font-family="Arial,sans-serif" font-size="19" font-weight="700">Older children &amp; adolescents</text>
  <text x="600" y="278" text-anchor="middle" fill="#716281" font-family="Arial,sans-serif" font-size="15">Temporal regularities across events</text>
  <rect x="474" y="318" width="252" height="61" rx="13" fill="#fff" stroke="#d8cde2" stroke-width="2"/>
  <circle cx="508" cy="348" r="12" fill="#8d75a8"/><circle cx="600" cy="348" r="12" fill="#8d75a8"/><circle cx="692" cy="348" r="12" fill="#8d75a8"/>
  <line x1="523" y1="348" x2="585" y2="348" stroke="#a594b7" stroke-width="3"/><line x1="615" y1="348" x2="677" y2="348" stroke="#a594b7" stroke-width="3"/>
  <text x="600" y="414" text-anchor="middle" fill="#716281" font-family="Arial,sans-serif" font-size="15">Hippocampus and lateral frontoparietal</text>
  <text x="600" y="437" text-anchor="middle" fill="#716281" font-family="Arial,sans-serif" font-size="15">areas support broader patterns</text>
  <rect x="480" y="464" width="240" height="39" rx="18" fill="#ebe4f2"/>
  <text x="600" y="490" text-anchor="middle" fill="#68557e" font-family="Arial,sans-serif" font-size="14" font-weight="700">BINDING + PATTERN REINSTATEMENT</text>
  <line x1="775" y1="365" x2="807" y2="365" stroke="#67838f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="818" y="207" width="300" height="320" rx="18" fill="#f2f5ed" stroke="#d8dfc8" stroke-width="2"/>
  <text x="968" y="249" text-anchor="middle" fill="#52643b" font-family="Arial,sans-serif" font-size="19" font-weight="700">Adults</text>
  <text x="968" y="278" text-anchor="middle" fill="#657154" font-family="Arial,sans-serif" font-size="15">Hierarchical temporal knowledge</text>
  <rect x="856" y="318" width="224" height="61" rx="13" fill="#fff" stroke="#d4dcc7" stroke-width="2"/>
  <circle cx="887" cy="348" r="10" fill="#829a5d"/><circle cx="932" cy="348" r="10" fill="#829a5d"/><circle cx="1004" cy="348" r="10" fill="#829a5d"/><circle cx="1049" cy="348" r="10" fill="#829a5d"/>
  <line x1="899" y1="348" x2="920" y2="348" stroke="#a4b48b" stroke-width="3"/><line x1="944" y1="348" x2="992" y2="348" stroke="#a4b48b" stroke-width="3"/><line x1="1016" y1="348" x2="1037" y2="348" stroke="#a4b48b" stroke-width="3"/>
  <path d="M887 333 C915 302 1021 302 1049 333" fill="none" stroke="#9baa7c" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="968" y="414" text-anchor="middle" fill="#657154" font-family="Arial,sans-serif" font-size="15">Details and general patterns can</text>
  <text x="968" y="437" text-anchor="middle" fill="#657154" font-family="Arial,sans-serif" font-size="15">be flexibly used in new contexts</text>
  <rect x="858" y="464" width="220" height="39" rx="18" fill="#e8eddf"/>
  <text x="968" y="490" text-anchor="middle" fill="#5d6e47" font-family="Arial,sans-serif" font-size="14" font-weight="700">HIPPOCAMPUS + mFPN</text>
  <rect x="82" y="550" width="1036" height="54" rx="15" fill="#f6f2e9"/>
  <text x="600" y="583" text-anchor="middle" fill="#80632f" font-family="Arial,sans-serif" font-size="15" font-weight="700">2026 REVIEW SYNTHESIS · A PROPOSED FRAMEWORK, NOT A SINGLE LONGITUDINAL EXPERIMENT</text>
  <text x="82" y="628" fill="#8298a1" font-family="Arial,sans-serif" font-size="13">Original explanatory schematic based on Friend, Pathman &amp; Preston (2026).</text>
</svg>
