<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="465" viewBox="0 0 1100 465" role="img" aria-label="When explicit goals diverge from implicit needs"><rect width="1100" height="465" rx="18" fill="#f7f8fa"/><text x="45" y="48" font-family="Arial,sans-serif" font-size="15" fill="#5b6b7d" font-weight="600">WORLD MODELING ATLAS · CONCEPTUAL GUIDE</text><text x="45" y="94" font-family="Arial,sans-serif" font-size="30" fill="#162a40" font-weight="600">When explicit goals diverge from implicit needs</text><rect x="45" y="135" width="318" height="210" rx="13" fill="#dff0eb" stroke="#bcc8d4"/><text x="63" y="166" font-family="Arial,sans-serif" font-size="15" fill="#5b6b7d" font-weight="600">01</text><text x="63" y="205" font-family="Arial,sans-serif" font-size="21" fill="#162a40" font-weight="600">Goal</text><text x="63" y="250" dy="0" font-family="Arial,sans-serif" font-size="18" fill="#33475c">Maintain a consciously</text><text x="63" y="250" dy="27" font-family="Arial,sans-serif" font-size="18" fill="#33475c">represented objective.</text><path d="M 368 244 h 12" stroke="#567483" stroke-width="3"/><path d="M 375 239 l 7 5 l -7 5" fill="none" stroke="#567483" stroke-width="3"/><rect x="386" y="135" width="318" height="210" rx="13" fill="#e8edf7" stroke="#bcc8d4"/><text x="404" y="166" font-family="Arial,sans-serif" font-size="15" fill="#5b6b7d" font-weight="600">02</text><text x="404" y="205" font-family="Arial,sans-serif" font-size="21" fill="#162a40" font-weight="600">Competing drive</text><text x="404" y="250" dy="0" font-family="Arial,sans-serif" font-size="18" fill="#33475c">Track immediate</text><text x="404" y="250" dy="27" font-family="Arial,sans-serif" font-size="18" fill="#33475c">biological or affective</text><text x="404" y="250" dy="54" font-family="Arial,sans-serif" font-size="18" fill="#33475c">priorities.</text><path d="M 709 244 h 12" stroke="#567483" stroke-width="3"/><path d="M 716 239 l 7 5 l -7 5" fill="none" stroke="#567483" stroke-width="3"/><rect x="727" y="135" width="318" height="210" rx="13" fill="#fbedd2" stroke="#bcc8d4"/><text x="745" y="166" font-family="Arial,sans-serif" font-size="15" fill="#5b6b7d" font-weight="600">03</text><text x="745" y="205" font-family="Arial,sans-serif" font-size="21" fill="#162a40" font-weight="600">Reconciliation</text><text x="745" y="250" dy="0" font-family="Arial,sans-serif" font-size="18" fill="#33475c">Revise action or goal</text><text x="745" y="250" dy="27" font-family="Arial,sans-serif" font-size="18" fill="#33475c">when costs become clear.</text><rect x="45" y="372" width="1010" height="54" rx="10" fill="#162a40"/><text x="65" y="405" font-family="Arial,sans-serif" font-size="18" fill="#fff" font-weight="600">Goal systems can align with or override implicit priorities.</text></svg>