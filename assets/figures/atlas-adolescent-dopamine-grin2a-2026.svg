<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">GluN2A in adolescent dopamine neurons supports feedback-guided learning</title>
<desc id="desc">Original summary of a 2026 rodent study. GluN2A levels normally declined during adolescence in dopamine-neuron-containing brain regions while remaining comparatively stable in cortex. Genetically reducing Grin2a in adolescent rat dopamine neurons disrupted dopamine prediction-error signals, effort optimization, feedback-driven changes in motivated actions, and model-estimated gating of learned associations.</desc>
