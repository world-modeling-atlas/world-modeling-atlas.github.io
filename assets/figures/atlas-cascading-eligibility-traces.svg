<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Cascading eligibility traces preserve event timing for delayed feedback</title>
  <desc id="desc">An original schematic comparing an exponentially decaying eligibility trace, which blends nearby events, with a cascade of biochemical-inspired states that can peak at a chosen delay. A 2026 ICLR computational model reports credit assignment across seconds-to-minutes delays, with limits on difficult tasks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fafc"/><stop offset="1" stop-color="#edf3f6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#28404c" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67838f"/></marker>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <text x="54" y="65" fill="#173846" font-family="Arial,sans-serif" font-size="30" font-weight="700">A cascade can keep track of when an eligible event happened</text>
  <text x="56" y="99" fill="#56717c" font-family="Arial,sans-serif" font-size="17">An ICLR 2026 model proposes a more temporally precise trace for delayed credit signals.</text>
  <rect x="48" y="132" width="1104" height="516" rx="22" fill="#fff" filter="url(#shadow)"/>
  <rect x="82" y="170" width="484" height="378" rx="18" fill="#f3f6f7" stroke="#d6e1e5" stroke-width="2"/>
  <text x="112" y="210" fill="#315261" font-family="Arial,sans-serif" font-size="18" font-weight="700">STANDARD EXPONENTIAL TRACE</text>
  <text x="112" y="238" fill="#59737d" font-family="Arial,sans-serif" font-size="15">A broad decay can mix nearby events.</text>
  <line x1="130" y1="458" x2="520" y2="458" stroke="#a9bbc2" stroke-width="2"/>
  <line x1="130" y1="278" x2="130" y2="458" stroke="#a9bbc2" stroke-width="2"/>
  <text x="135" y="487" fill="#748992" font-family="Arial,sans-serif" font-size="13">event A</text>
  <text x="245" y="487" fill="#748992" font-family="Arial,sans-serif" font-size="13">event B</text>
  <text x="440" y="487" fill="#748992" font-family="Arial,sans-serif" font-size="13">delayed signal</text>
  <line x1="165" y1="453" x2="165" y2="344" stroke="#4b8b93" stroke-width="4"/>
  <line x1="275" y1="453" x2="275" y2="344" stroke="#9a78b5" stroke-width="4"/>
  <path d="M165 344 C190 349 218 368 245 380 C273 393 306 405 339 414 C374 424 416 433 476 441" fill="none" stroke="#4b8b93" stroke-width="4"/>
  <path d="M275 344 C298 349 322 365 344 377 C371 390 407 407 476 427" fill="none" stroke="#9a78b5" stroke-width="4" stroke-dasharray="8 5"/>
  <line x1="476" y1="300" x2="476" y2="458" stroke="#c88755" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M163 268 L163 300 M163 268 L463 268" fill="none" stroke="#8b9ea6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="305" y="261" text-anchor="middle" fill="#647982" font-family="Arial,sans-serif" font-size="14">one delayed teaching signal</text>
  <rect x="112" y="511" width="423" height="25" rx="12" fill="#f4e8df"/>
  <text x="324" y="529" text-anchor="middle" fill="#8a5b3d" font-family="Arial,sans-serif" font-size="13" font-weight="700">WHICH PAST EVENT SHOULD RECEIVE CREDIT?</text>
  <line x1="575" y1="358" x2="622" y2="358" stroke="#67838f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="636" y="170" width="482" height="378" rx="18" fill="#fbfafc" stroke="#e1d9e9" stroke-width="2"/>
  <text x="666" y="210" fill="#604878" font-family="Arial,sans-serif" font-size="18" font-weight="700">CASCADING ELIGIBILITY TRACE</text>
  <text x="666" y="238" fill="#716281" font-family="Arial,sans-serif" font-size="15">A chain of states preserves a tunable temporal signature.</text>
  <rect x="674" y="280" width="55" height="46" rx="13" fill="#e9f1f4" stroke="#c5d7de" stroke-width="2"/><text x="701" y="309" text-anchor="middle" fill="#456976" font-family="Arial,sans-serif" font-size="15" font-weight="700">1</text>
  <rect x="744" y="280" width="55" height="46" rx="13" fill="#e6eff1" stroke="#c5d7de" stroke-width="2"/><text x="771" y="309" text-anchor="middle" fill="#456976" font-family="Arial,sans-serif" font-size="15" font-weight="700">2</text>
  <rect x="814" y="280" width="55" height="46" rx="13" fill="#e1edf0" stroke="#c5d7de" stroke-width="2"/><text x="841" y="309" text-anchor="middle" fill="#456976" font-family="Arial,sans-serif" font-size="15" font-weight="700">3</text>
  <rect x="884" y="280" width="55" height="46" rx="13" fill="#dbe9ed" stroke="#c5d7de" stroke-width="2"/><text x="911" y="309" text-anchor="middle" fill="#456976" font-family="Arial,sans-serif" font-size="15" font-weight="700">4</text>
  <rect x="954" y="280" width="55" height="46" rx="13" fill="#d4e5e9" stroke="#c5d7de" stroke-width="2"/><text x="981" y="309" text-anchor="middle" fill="#456976" font-family="Arial,sans-serif" font-size="15" font-weight="700">5</text>
  <rect x="1024" y="280" width="55" height="46" rx="13" fill="#cce0e5" stroke="#c5d7de" stroke-width="2"/><text x="1051" y="309" text-anchor="middle" fill="#456976" font-family="Arial,sans-serif" font-size="15" font-weight="700">6</text>
  <line x1="730" y1="303" x2="742" y2="303" stroke="#6c8c96" stroke-width="2" marker-end="url(#arrow)"/><line x1="800" y1="303" x2="812" y2="303" stroke="#6c8c96" stroke-width="2" marker-end="url(#arrow)"/><line x1="870" y1="303" x2="882" y2="303" stroke="#6c8c96" stroke-width="2" marker-end="url(#arrow)"/><line x1="940" y1="303" x2="952" y2="303" stroke="#6c8c96" stroke-width="2" marker-end="url(#arrow)"/><line x1="1010" y1="303" x2="1022" y2="303" stroke="#6c8c96" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="876" y="356" text-anchor="middle" fill="#647982" font-family="Arial,sans-serif" font-size="14">past activity moves through successive memory states</text>
  <line x1="674" y1="458" x2="1080" y2="458" stroke="#a9bbc2" stroke-width="2"/>
  <line x1="674" y1="378" x2="674" y2="458" stroke="#a9bbc2" stroke-width="2"/>
  <path d="M684 449 C749 445 770 434 797 417 C829 395 850 376 878 362 C909 348 941 362 965 393 C991 426 1026 442 1075 448" fill="none" stroke="#80619a" stroke-width="5" stroke-linecap="round"/>
  <line x1="914" y1="370" x2="914" y2="458" stroke="#c88755" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="914" y="485" text-anchor="middle" fill="#8a5b3d" font-family="Arial,sans-serif" font-size="13" font-weight="700">TARGET DELAY</text>
  <text x="876" y="518" text-anchor="middle" fill="#716281" font-family="Arial,sans-serif" font-size="14">trace peaks near the time the feedback arrives</text>
  <rect x="82" y="567" width="1036" height="45" rx="15" fill="#f6f2e9"/>
  <text x="600" y="596" text-anchor="middle" fill="#80632f" font-family="Arial,sans-serif" font-size="15" font-weight="700">ICLR 2026 COMPUTATIONAL MODEL · TESTED DELAYS FROM SECONDS TO MINUTES; COMPLEX TASKS REMAIN CHALLENGING</text>
  <text x="82" y="635" fill="#8298a1" font-family="Arial,sans-serif" font-size="13">Original explanatory schematic based on Ralambomihanta et al. (2026).</text>
</svg>
