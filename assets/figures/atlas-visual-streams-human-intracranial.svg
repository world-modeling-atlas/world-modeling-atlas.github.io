<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Human intracranial recordings reveal visual information flow across streams</title>
  <desc id="desc">A conceptual summary of a 2026 study of 22 patients undergoing intracranial EEG for epilepsy. Responses to novel pictures appeared first in posterior visual cortex and then in dorsal and ventral pathways, with later activity in frontal and limbic regions. Face and place responses showed partially distinct patterns.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fafc"/><stop offset="1" stop-color="#edf3f6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#28404c" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67838f"/></marker>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <text x="54" y="65" fill="#173846" font-family="Arial,sans-serif" font-size="30" font-weight="700">Visual streams unfold through a wider brain network</text>
  <text x="56" y="99" fill="#56717c" font-family="Arial,sans-serif" font-size="17">2026 intracranial recordings tracked responses to novel faces and places.</text>
  <rect x="48" y="132" width="1104" height="518" rx="22" fill="#fff" filter="url(#shadow)"/>
  <rect x="82" y="174" width="1036" height="92" rx="17" fill="#f1f6f7"/>
  <text x="112" y="211" fill="#315261" font-family="Arial,sans-serif" font-size="17" font-weight="700">CLINICAL RECORDING COHORT</text>
  <text x="112" y="240" fill="#59737d" font-family="Arial,sans-serif" font-size="16">22 people with epilepsy undergoing depth-electrode monitoring viewed novel pictures; high-frequency brain activity was measured.</text>
  <text x="82" y="312" fill="#315261" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1">EARLY POSTERIOR RESPONSES, THEN PARALLEL ROUTES AND WIDER INTEGRATION</text>
  <rect x="82" y="342" width="205" height="145" rx="16" fill="#e8f1f5" stroke="#bed2da" stroke-width="2"/>
  <text x="184" y="381" text-anchor="middle" fill="#315b69" font-family="Arial,sans-serif" font-size="17" font-weight="700">Occipital</text>
  <text x="184" y="408" text-anchor="middle" fill="#4f707c" font-family="Arial,sans-serif" font-size="15">visual cortex</text>
  <text x="184" y="451" text-anchor="middle" fill="#65808a" font-family="Arial,sans-serif" font-size="14">earliest measured responses</text>
  <line x1="291" y1="411" x2="350" y2="411" stroke="#67838f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="365" y="342" width="243" height="63" rx="15" fill="#eaf4f2" stroke="#bddbd5" stroke-width="2"/>
  <text x="486" y="369" text-anchor="middle" fill="#236e68" font-family="Arial,sans-serif" font-size="16" font-weight="700">Dorsal route</text>
  <text x="486" y="391" text-anchor="middle" fill="#4b716f" font-family="Arial,sans-serif" font-size="14">parietal regions</text>
  <rect x="365" y="424" width="243" height="63" rx="15" fill="#f3eef8" stroke="#d8c9e5" stroke-width="2"/>
  <text x="486" y="451" text-anchor="middle" fill="#755295" font-family="Arial,sans-serif" font-size="16" font-weight="700">Ventral route</text>
  <text x="486" y="473" text-anchor="middle" fill="#746483" font-family="Arial,sans-serif" font-size="14">temporal regions</text>
  <line x1="610" y1="374" x2="683" y2="374" stroke="#67838f" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="610" y1="456" x2="683" y2="456" stroke="#67838f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="697" y="342" width="192" height="145" rx="16" fill="#f6f2e9" stroke="#e2d4b9" stroke-width="2"/>
  <text x="793" y="382" text-anchor="middle" fill="#8a672f" font-family="Arial,sans-serif" font-size="16" font-weight="700">Frontal regions</text>
  <text x="793" y="410" text-anchor="middle" fill="#7b6d50" font-family="Arial,sans-serif" font-size="14">later responses</text>
  <text x="793" y="452" text-anchor="middle" fill="#7b6d50" font-family="Arial,sans-serif" font-size="14">category-related patterns</text>
  <line x1="891" y1="411" x2="946" y2="411" stroke="#67838f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="960" y="342" width="158" height="145" rx="16" fill="#f8eef0" stroke="#e5c7ce" stroke-width="2"/>
  <text x="1039" y="382" text-anchor="middle" fill="#965b69" font-family="Arial,sans-serif" font-size="16" font-weight="700">Limbic</text>
  <text x="1039" y="410" text-anchor="middle" fill="#815e67" font-family="Arial,sans-serif" font-size="14">hippocampus</text>
  <text x="1039" y="433" text-anchor="middle" fill="#815e67" font-family="Arial,sans-serif" font-size="14">and amygdala</text>
  <rect x="82" y="518" width="500" height="77" rx="15" fill="#f3eef8"/>
  <text x="108" y="548" fill="#755295" font-family="Arial,sans-serif" font-size="16" font-weight="700">FACE-RESPONSIVE CONTACTS</text>
  <text x="108" y="575" fill="#655877" font-family="Arial,sans-serif" font-size="15">Partly distinct timing and pathway patterns</text>
  <rect x="600" y="518" width="518" height="77" rx="15" fill="#eaf4f2"/>
  <text x="626" y="548" fill="#236e68" font-family="Arial,sans-serif" font-size="16" font-weight="700">PLACE-RESPONSIVE CONTACTS</text>
  <text x="626" y="575" fill="#4b716f" font-family="Arial,sans-serif" font-size="15">Partly distinct timing and pathway patterns</text>
  <text x="82" y="626" fill="#8298a1" font-family="Arial,sans-serif" font-size="13">Original schematic based on Huang et al. (2026); lead–lag measures suggest direction but do not prove causal transmission.</text>
</svg>
