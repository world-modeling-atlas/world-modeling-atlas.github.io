<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="465" viewBox="0 0 1100 465" role="img" aria-label="Gaze-centered remapping of touch from a hand-held tool into external space"><rect width="1100" height="465" rx="18" fill="#f7f8fa"/><text x="45" y="48" font-family="Arial,sans-serif" font-size="15" fill="#5b6b7d" font-weight="600">WORLD MODELING ATLAS · 2026 MODEL-DRIVEN PSYCHOPHYSICS</text><text x="45" y="94" font-family="Arial,sans-serif" font-size="30" fill="#162a40" font-weight="600">Gaze-centered remapping can project touch beyond the body</text><rect x="45" y="135" width="318" height="210" rx="13" fill="#dff0eb" stroke="#bcc8d4"/><text x="63" y="166" font-family="Arial,sans-serif" font-size="15" fill="#5b6b7d" font-weight="600">01 · TOOL CONTACT</text><text x="63" y="212" font-family="Arial,sans-serif" font-size="20" fill="#162a40" font-weight="600">Touch at the rod tip</text><text x="63" y="255" font-family="Arial,sans-serif" font-size="18" fill="#33475c">A hand-held rod contacts an object</text><text x="63" y="282" font-family="Arial,sans-serif" font-size="18" fill="#33475c">outside the body.</text><path d="M 363 240 h 28 M 381 233 l 10 7 l -10 7" stroke="#567483" stroke-width="3" fill="none"/><rect x="391" y="135" width="318" height="210" rx="13" fill="#e8edf7" stroke="#bcc8d4"/><text x="409" y="166" font-family="Arial,sans-serif" font-size="15" fill="#5b6b7d" font-weight="600">02 · BODY-REFERENCED ESTIMATE</text><text x="409" y="212" font-family="Arial,sans-serif" font-size="20" fill="#162a40" font-weight="600">Relate touch to the hand</text><text x="409" y="255" font-family="Arial,sans-serif" font-size="18" fill="#33475c">Combine tool posture with sensory</text><text x="409" y="282" font-family="Arial,sans-serif" font-size="18" fill="#33475c">feedback to estimate location.</text><path d="M 709 240 h 28 M 727 233 l 10 7 l -10 7" stroke="#567483" stroke-width="3" fill="none"/><rect x="737" y="135" width="318" height="210" rx="13" fill="#fbedd2" stroke="#bcc8d4"/><text x="755" y="166" font-family="Arial,sans-serif" font-size="15" fill="#5b6b7d" font-weight="600">03 · GAZE-REFERENCED SPACE</text><text x="755" y="212" font-family="Arial,sans-serif" font-size="20" fill="#162a40" font-weight="600">Compare with fixation</text><text x="755" y="255" font-family="Arial,sans-serif" font-size="18" fill="#33475c">Use gaze as an external reference</text><text x="755" y="282" font-family="Arial,sans-serif" font-size="18" fill="#33475c">for the projected touch location.</text><rect x="45" y="372" width="1010" height="54" rx="10" fill="#162a40"/><text x="65" y="405" font-family="Arial,sans-serif" font-size="18" fill="#fff" font-weight="600">A 2026 study found gaze-centered projection with spatial resolution comparable to touch on the body.</text></svg>