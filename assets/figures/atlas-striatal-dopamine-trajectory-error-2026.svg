<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Striatal dopamine separates trajectory error from cue value</title>
<desc id="desc">Original summary of a 2026 mouse navigation study using striatum-wide fibre recordings. Cue-evoked dopamine carried both learned cue value and a movement trajectory error indicating whether motion was toward or away from a goal. Value signals preceded trajectory-error signals by roughly 0.3 seconds, and their spatial gradients were approximately orthogonal, allowing separate readout.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fafc"/><stop offset="1" stop-color="#edf3f6"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#28404c" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67838f"/></marker></defs>
<rect width="1200" height="690" rx="28" fill="url(#bg)"/><text x="54" y="62" fill="#173846" font-family="Arial,sans-serif" font-size="30" font-weight="700">Dopamine carries both goal value and movement guidance</text><text x="56" y="96" fill="#56717c" font-family="Arial,sans-serif" font-size="17">Striatum-wide recordings during mouse navigation · Brown et al., Nature (2026)</text>
<rect x="48" y="130" width="1104" height="500" rx="22" fill="#fff" filter="url(#shadow)"/>
<rect x="90" y="180" width="1020" height="155" rx="18" fill="#f5f8fa"/><text x="122" y="218" fill="#315261" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1">NAVIGATION CUE</text><circle cx="280" cy="266" r="27" fill="#e7b55d"/><text x="280" y="272" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">cue</text><circle cx="900" cy="265" r="31" fill="#91b69c"/><text x="900" y="271" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">goal</text><path d="M340 265 L550 265" stroke="#78929c" stroke-width="5" marker-end="url(#arrow)"/><path d="M840 294 L500 294" fill="none" stroke="#bd6c76" stroke-width="4" marker-end="url(#arrow)"/><text x="627" y="247" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="14">movement toward goal</text><text x="681" y="320" text-anchor="middle" fill="#8d4c58" font-family="Arial,sans-serif" font-size="14">trajectory error: movement away from goal</text>
<text x="170" y="384" fill="#315261" font-family="Arial,sans-serif" font-size="16" font-weight="700">CUE-EVOKED DOPAMINE</text><line x1="166" y1="535" x2="632" y2="535" stroke="#b9cbd2" stroke-width="2"/><line x1="166" y1="405" x2="166" y2="535" stroke="#b9cbd2" stroke-width="2"/><path d="M180 499 C232 499 255 420 308 420 C362 420 371 463 423 463 C478 463 487 507 550 507 C584 507 605 511 620 512" fill="none" stroke="#6d98b2" stroke-width="6"/><path d="M180 514 C270 514 316 514 374 514 C405 514 421 523 443 526 C470 530 496 475 530 475 C566 475 584 500 620 500" fill="none" stroke="#bb7781" stroke-width="6"/><text x="405" y="418" fill="#527b95" font-family="Arial,sans-serif" font-size="14" font-weight="700">Cue value first</text><text x="515" y="463" fill="#965864" font-family="Arial,sans-serif" font-size="14" font-weight="700">Trajectory error later</text><text x="399" y="562" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="14">value encoding preceded trajectory-error encoding by ~0.3 s</text>
<rect x="704" y="382" width="380" height="191" rx="16" fill="#f5f8fa" stroke="#d8e2e6" stroke-width="2"/><text x="894" y="416" text-anchor="middle" fill="#315261" font-family="Arial,sans-serif" font-size="16" font-weight="700">Different striatal gradients</text><path d="M784 520 L1004 520" stroke="#6d98b2" stroke-width="6" marker-end="url(#arrow)"/><text x="894" y="548" text-anchor="middle" fill="#527b95" font-family="Arial,sans-serif" font-size="14">trajectory error: anterior-biased</text><path d="M894 494 L894 444" stroke="#bb7781" stroke-width="6" marker-end="url(#arrow)"/><text x="1000" y="463" text-anchor="middle" fill="#965864" font-family="Arial,sans-serif" font-size="13">cue value: medial-biased</text>
<text x="600" y="608" text-anchor="middle" fill="#718994" font-family="Arial,sans-serif" font-size="13">Overlapping signals vary along roughly orthogonal axes; schematic summary, not a quantitative reconstruction.</text>
</svg>
