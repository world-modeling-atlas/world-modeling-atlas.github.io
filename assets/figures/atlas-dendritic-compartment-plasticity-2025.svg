<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Distinct plasticity rules in apical and basal dendrites during learning</title>
<desc id="desc">Original schematic summarizing a 2025 in vivo mouse motor-cortex study. Local coactivity among nearby apical synapses predicted their strengthening, while basal synaptic strengthening depended on activity coincident with postsynaptic action potentials. Blocking postsynaptic spiking reduced basal but not apical potentiation.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fafc"/><stop offset="1" stop-color="#edf3f6"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#28404c" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67838f"/></marker></defs>
<rect width="1200" height="690" rx="28" fill="url(#bg)"/><text x="54" y="62" fill="#173846" font-family="Arial,sans-serif" font-size="30" font-weight="700">One pyramidal neuron can learn with different local rules</text><text x="56" y="96" fill="#56717c" font-family="Arial,sans-serif" font-size="17">In vivo single-synapse imaging during mouse motor learning · Wright et al., Science (2025)</text>
<rect x="48" y="130" width="1104" height="500" rx="22" fill="#fff" filter="url(#shadow)"/>
<rect x="82" y="170" width="486" height="380" rx="18" fill="#f2f7f5"/><rect x="632" y="170" width="486" height="380" rx="18" fill="#f7f3f4"/>
<text x="325" y="212" text-anchor="middle" fill="#3e625f" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing=".6">APICAL DENDRITES</text><text x="875" y="212" text-anchor="middle" fill="#8d4c58" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing=".6">BASAL DENDRITES</text>
<text x="325" y="246" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="16">Nearby synapses coactivate</text><path d="M172 322 C270 318 374 317 482 322" fill="none" stroke="#7395a1" stroke-width="16" stroke-linecap="round"/><circle cx="230" cy="311" r="13" fill="#db8a52"/><circle cx="257" cy="311" r="13" fill="#db8a52"/><circle cx="284" cy="311" r="13" fill="#db8a52"/><circle cx="390" cy="311" r="10" fill="#b9cbd2"/><circle cx="421" cy="311" r="10" fill="#b9cbd2"/><path d="M220 285 C245 265 278 265 302 285" fill="none" stroke="#8bb6a7" stroke-width="3" stroke-dasharray="7 7"/>
<rect x="132" y="367" width="386" height="82" rx="14" fill="#fff" stroke="#d5e4dc" stroke-width="2"/><text x="325" y="400" text-anchor="middle" fill="#3e625f" font-family="Arial,sans-serif" font-size="17" font-weight="700">Local coactivity predicted</text><text x="325" y="425" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="16">which apical synapses strengthened</text>
<text x="875" y="246" text-anchor="middle" fill="#56717c" font-family="Arial,sans-serif" font-size="16">Synapse activity coincides with cell output</text><path d="M690 322 C787 318 896 317 1060 322" fill="none" stroke="#7395a1" stroke-width="16" stroke-linecap="round"/><circle cx="816" cy="311" r="13" fill="#db8a52"/><path d="M816 288 C827 270 839 255 853 245" fill="none" stroke="#67838f" stroke-width="3" marker-end="url(#arrow)"/><path d="M894 366 L894 326 L916 326 L916 366 L938 366 L938 305 L960 305 L960 366 L982 366 L982 340 L1004 340 L1004 366" fill="none" stroke="#bd6c76" stroke-width="4"/><text x="949" y="397" text-anchor="middle" fill="#8d4c58" font-family="Arial,sans-serif" font-size="15" font-weight="700">Postsynaptic spikes</text>
<rect x="682" y="430" width="386" height="54" rx="14" fill="#fff" stroke="#ead9dc" stroke-width="2"/><text x="875" y="463" text-anchor="middle" fill="#8d4c58" font-family="Arial,sans-serif" font-size="16" font-weight="700">predicted basal synaptic strengthening</text>
<rect x="132" y="487" width="936" height="43" rx="12" fill="#f5f8fa" stroke="#d8e2e6" stroke-width="2"/><text x="600" y="515" text-anchor="middle" fill="#294c5a" font-family="Arial,sans-serif" font-size="15">Blocking postsynaptic spiking reduced basal, but not apical, potentiation.</text>
<text x="600" y="589" text-anchor="middle" fill="#718994" font-family="Arial,sans-serif" font-size="13">Results from layer 2/3 mouse motor cortex during a lever-learning task; original summary diagram, not to scale.</text>
