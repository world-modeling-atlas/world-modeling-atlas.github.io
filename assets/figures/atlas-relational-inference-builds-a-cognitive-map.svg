<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img" aria-label="A developmental fMRI study tests how people learn local relations, infer a two-dimensional knowledge map, and assimilate new facts">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#187f88"/></marker></defs>
<rect width="1160" height="650" rx="12" fill="#f6f9fa"/>
<text x="40" y="48" fill="#183344" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="600">From local facts to a relational knowledge map</text>
<text x="40" y="78" fill="#526876" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">2026 DEVELOPMENTAL fMRI STUDY · ORIGINAL EXPLANATORY SCHEMATIC</text>
<text x="40" y="115" fill="#526876" font-family="DejaVu Sans,Arial,sans-serif" font-size="16">203 participants, ages 8–25 · two attributes define a hidden two-dimensional structure</text>

